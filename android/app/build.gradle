plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.btchat.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.btchat.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // חתימה קבועה, מוטמעת בריפו (keystore/release.jks) - בלי שום Secret
    // או הגדרה ידנית. כל build (ידני או ב-CI) חתום באותו מפתח בדיוק, אז
    // Android מזהה עדכונים על גבי ההתקנה הקיימת ולא דורש הסרה.
    signingConfigs {
        release {
            storeFile file("keystore/release.jks")
            storePassword "BtChat2026Secure!"
            keyAlias "btchat"
            keyPassword "BtChat2026Secure!"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            // גם ה-debug build חתום באותו מפתח, כדי שאפשר יהיה לעדכן
            // APK debug->debug או debug->release בלי הסרה.
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.9.1'
}
