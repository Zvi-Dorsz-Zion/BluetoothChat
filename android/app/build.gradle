plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def keystoreBase64File = file("keystore/release.jks.base64")
def keystoreFile = file("keystore/release.jks")
if (keystoreBase64File.exists()) {
    keystoreFile.bytes = Base64.getDecoder().decode(keystoreBase64File.text.trim())
}

android {
    namespace 'com.btchat.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.btchat.app"
        minSdk 29
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
        versionName "2.2"
    }

    signingConfigs {
        release {
            storeFile keystoreFile
            storePassword "BtChat2026Secure!"
            keyAlias "btchat"
            keyPassword "BtChat2026Secure!"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
