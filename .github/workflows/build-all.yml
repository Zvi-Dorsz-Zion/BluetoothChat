name: Build Everything (Android + Windows)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

env:
  APP_VERSION: "2.2"

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: BtChat-android-apk
          path: android/app/build/outputs/apk/release/*.apk

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows/BtChatWpf
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Publish self-contained exe
        run: >
          dotnet publish -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -o publish

      - name: Upload Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: BtChat-windows-exe
          path: windows/BtChatWpf/publish/BtChat.exe

  # Collects both builds into a DRAFT release (Releases page). Nothing is published
  # until you open the draft and press "Publish release".
  draft-release:
    needs: [ build-android, build-windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Name files by version
        run: |
          VERSION="${APP_VERSION}.${GITHUB_RUN_NUMBER}"
          mv dist/app-release.apk "dist/BtChat-${VERSION}.apk"
          mv dist/BtChat.exe "dist/BtChat-${VERSION}.exe"
          ls -l dist

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: v${{ env.APP_VERSION }}.${{ github.run_number }}
          name: BT Chat ${{ env.APP_VERSION }}.${{ github.run_number }}
          body: |
            - **Android**: `BtChat-${{ env.APP_VERSION }}.${{ github.run_number }}.apk` (מתקין מעל הגרסה הקודמת)
            - **Windows**: `BtChat-${{ env.APP_VERSION }}.${{ github.run_number }}.exe`
          files: dist/*
